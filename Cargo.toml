[package]
name = "kvellox"
version = "0.1.0"
edition = "2021"

[dependencies]
bbqueue = "0.5.1"
clap = { version = "4.5.32", features = ["derive"] }
crossbeam-queue = "0.3.12"
io-uring = "0.7.4"
rart = { git = "https://github.com/rdaum/rart-rs.git", version = "0.1.0" }
tokio = { version = "1.44.1", features = ["full", "rt"] }
tokio-uring = { version = "0.5.0", features = ["bytes"] }
